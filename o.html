    const SHA256 = async (input) => {
  const textAsBuffer = new TextEncoder().encode(input);
  const hashBuffer = await window.crypto.subtle.digest("SHA-256", textAsBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  const hash = hashArray
    .map((item) => item.toString(16).padStart(2, "0"))
    .join("");
  return hash;
};

async function shaPow(data, n) {
    let _=[];
    for(let i=0; i<n; i++) {
        if(_.length==0) _.push(await SHA256(data));
        else _.push(await SHA256(_[_.length-1]));
    }
    return _;
}

function encodeChar(data, password) {
    
    return String.fromCharCode((256 + data.charCodeAt(0) + password.charCodeAt(0))%256);
}

function decodeChar(data, password) {
    return String.fromCharCode((256+ data.charCodeAt(0) - password.charCodeAt(0))%256);
}

function encodeChunk(data, password) {
    if(data.length != password.length) throw new Error('Mismatch')
    let _ = '';
    for(i = 0; i < data.length; i++) {
        _+=encodeChar(data[i],password[i])
    }
    return _;
}

function decodeChunk(data, password) {
    if(data.length != password.length) throw new Error('Mismatch')
    let _ = '';
    for(let i = 0; i < data.length; i++) {
        _+=decodeChar(data[i],password[i])
    }
    return _;
}

async function encode(data, password) {
    //Chunking
    const n = password.length;
    const result = [];
    // First N characters (N = password length)
    result.push(data.slice(0, n));
    // Remaining data split into 64-char chunks (length of sha256)
    const remaining = data.slice(n);
    for (let i = 0; i < remaining.length; i += 64) {
        result.push(remaining.slice(i, i + 64));
    }
    let _T='';
    let _P=await shaPow(password,result.length);
    for(let i = 0; i < result.length; i++) {
        _T+=encodeChunk(result[i],_P[i].substring(0,result[i].length));
    }
    return _T;
}

async function decode(data, password) {
    //Chunking
    const n = password.length;
    const result = [];
    // First N characters (N = password length)
    result.push(data.slice(0, n));
    // Remaining data split into 64-char chunks (length of sha256)
    const remaining = data.slice(n);
    for (let i = 0; i < remaining.length; i += 64) {
        result.push(remaining.slice(i, i + 64));
    }
    let _T='';
    let _P=await shaPow(password,result.length);
    for(let i = 0; i < result.length; i++) {
        _T+=decodeChunk(result[i],_P[i].substring(0,result[i].length));
    }
    return _T;
}
